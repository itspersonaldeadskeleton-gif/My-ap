name: wardrobe_ai
description: Smart outfit picker that digitizes your wardrobe and styles you step by step.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0" # CardThemeData / Material 3 APIs

dependencies:
  flutter:
    sdk: flutter
  # State + navigation
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  # Local storage (Drift = typed SQLite; images live in app documents dir)
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.4
  # Camera / ML / network (used from Step 2 on)
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  google_mlkit_subject_segmentation: ^0.0.1
  dio: ^5.7.0
  geolocator: ^13.0.2
  flutter_dotenv: ^5.2.1
  # UI + animation
  flutter_animate: ^4.5.2
  lottie: ^3.2.0
  confetti: ^0.8.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  share_plus: ^10.1.4
  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/lottie/
